rect width="510" height="72" rx="12" fill="#f8f2ff" stroke="#8d76c9"/><text x="16" y="27" fill="#704eb3" font-weight="700">D8  香格里拉</text><text x="16" y="53" fill="#526a59">纳帕海环湖 · 第三晚已确认</text></g><g transform="translate(34 748)"><rect width="510" height="72" rx="12" fill="#eaf4ea" stroke="#607e6c"/><text x="16" y="27" fill="#466151" font-weight="700">D9  香格里拉 → 丽江</text><text x="16" y="53" fill="#526a59">不经过飞来寺 · 丽江待订 1 晚</text></g><g transform="translate(34 830)"><rect width="510" height="72" rx="12" fill="#eaf4ea" stroke="#607e6c"/><text x="16" y="27" fill="#466151" font-weight="700">D10  丽江 → 昆明</text><text x="16" y="53" fill="#526a59">520km · 昆明待订 1 晚</text></g><g transform="translate(34 912)"><rect width="510" height="72" rx="12" fill="#eaf4ea" stroke="#607e6c"/><text x="16" y="27" fill="#466151" font-weight="700">D11  昆明 → 南宁</text><text x="16" y="53" fill="#526a59">800km · 南宁待订第 1 晚</text></g><g transform="translate(34 994)"><rect width="510" height="72" rx="12" fill="#eaf4ea" stroke="#607e6c"/><text x="16" y="27" fill="#466151" font-weight="700">D12  南宁</text><text x="16" y="53" fill="#526a59">市内休整 · 南宁待订第 2 晚</text></g><g transform="translate(34 1076)"><rect width="510" height="72" rx="12" fill="#f3f5f4" stroke="#98a4a0"/><text x="16" y="27" fill="#466151" font-weight="700">D13  南宁 → 深圳</text><text x="16" y="53" fill="#526a59">720km · 安全抵达 · 旅途收束</text></g></g>
