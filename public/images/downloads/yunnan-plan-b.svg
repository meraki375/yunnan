  <g transform="translate(52 42)" filter="url(#s)"><rect width="1085" height="1196" rx="24" fill="#fffdf8" stroke="#607e6c" stroke-width="2"/><text x="52" y="76" fill="#102c62" font-family="serif" font-size="52" font-weight="700">深圳 → 云南 13 天自驾攻略</text><text x="52" y="116" fill="#607e6c" font-family="monospace" font-size="19" letter-spacing="4">PLAN B / 天气备选 · 跳过飞来寺</text><text x="52" y="151" fill="#526a59" font-family="sans-serif" font-size="24">深圳 → 玉林 → 昆明 → 大理 → 香格里拉 → 丽江 → 昆明 → 南宁 → 深圳</text>
